[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nugs-cli"
version = "1.1.0"
description = "Unofficial CLI and Python client for nugs.net catalog discovery and logged-in web-player control."
readme = "README.md"
authors = [{ name = "Brian Snyder" }]
license = { text = "MIT" }
keywords = ["nugs", "nugs.net", "live-music", "concerts", "setlists", "jam-bands", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
    "Environment :: Console",
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/BsnizND/nugs-cli"
Repository = "https://github.com/BsnizND/nugs-cli.git"
Issues = "https://github.com/BsnizND/nugs-cli/issues"

[project.optional-dependencies]
player = [
    "playwright>=1.50,<2",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
nugs = "nugs_cli.cli:main"
nugs-cli = "nugs_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nugs_cli*"]
